<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards de Inglês</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .container {
            text-align: center;
        }

        .card {
            width: 300px;
            height: 200px;
            perspective: 1000px;
            position: relative;
            margin: 0 auto 20px;
        }

        .card .front, .card .back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            font-size: 20px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card .front {
            background-color: white;
            z-index: 2;
        }

        .card .back {
            background-color: #e0e0e0;
            transform: rotateY(180deg);
            z-index: 1;
        }

        .card.flipped .front {
            transform: rotateY(180deg);
        }

        .card.flipped .back {
            transform: rotateY(360deg);
        }

        .buttons button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 0 10px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
        }

        .difficulty-buttons {
            margin-bottom: 20px;
        }

        .difficulty-btn {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            margin: 0 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f0f0f0;
            color: #333;
        }

        .difficulty-btn.active {
            background-color: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="difficulty-buttons">
            <button class="difficulty-btn" data-difficulty="easy">Fácil</button>
            <button class="difficulty-btn" data-difficulty="medium">Médio</button>
            <button class="difficulty-btn" data-difficulty="hard">Difícil</button>
            <button class="difficulty-btn" data-difficulty="dictionary">Dicionário</button>
        </div>
        <div class="card">
            <div class="front"></div>
            <div class="back"></div>
        </div>
        <div class="buttons">
            <button id="flip-btn">Virar</button>
            <button id="next-btn">Próxima</button>
            <button id="audio-btn">🔊</button>
        </div>
    </div>

    <script src="words.js"></script>

</body>
</html>
